<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Humming Minds Support</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      margin: 0;
    }
    #chat {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .msg {
      margin: 8px 0;
      padding: 10px 12px;
      border-radius: 10px;
      max-width: 80%;
    }
    .user { background: #dbeafe; align-self: flex-end; }
    .bot { background: #e5e7eb; align-self: flex-start; }

    #inputBox {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      margin-left: 8px;
      padding: 10px 16px;
      border: none;
      background: #4f46e5;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    .cta {
      margin-top: 12px;
      padding: 12px;
      background: #fff7ed;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="chat">
    <div id="messages"></div>

    <div id="inputBox">
      <input id="input" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
